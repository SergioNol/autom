<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family={{tipografia}}:wght@500;600;800&display=block" rel="stylesheet">
<style>
  :root { --w: {{ancho}}px; --h: {{alto}}px; --mx: calc(var(--w) * 0.1); --my: calc(var(--h) * 0.1);
          --primario: {{color_primario}}; --secundario: {{color_secundario}}; --acento: {{color_acento}}; --texto: {{color_texto}}; }
  * { margin: 0; box-sizing: border-box; }
  body { width: var(--w); height: var(--h); overflow: hidden; font-family: '{{tipografia}}', system-ui, sans-serif; }
  .lienzo { position: relative; width: 100%; height: 100%; background: var(--secundario); color: var(--primario); }
  /* Foto del entorno de trabajo siempre desenfocada y aclarada: la protagonista es la tarjeta. */
  .fondo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: blur(calc(var(--w) * 0.008)); transform: scale(1.06); }
  .velo { position: absolute; inset: 0; background: color-mix(in srgb, var(--secundario) 35%, transparent); }
  .sin-fondo .fondo, .sin-fondo .velo { display: none; }
  .cabecera { position: absolute; top: var(--my); left: var(--mx); right: var(--mx); }
  .etiqueta { display: inline-block; background: var(--primario); color: var(--texto); font-weight: 600; font-size: calc(var(--w) * 0.026);
              padding: calc(var(--w) * 0.012) calc(var(--w) * 0.03); border-radius: 99px; margin-bottom: calc(var(--w) * 0.03); }
  .sin-etiqueta .etiqueta { display: none; }
  h1 { font-weight: 800; font-size: calc(var(--w) * 0.062); line-height: 1.1; letter-spacing: -0.02em; }
  /* Componente de interfaz flotando: esquinas redondeadas, sombra suave, mucho blanco. */
  .tarjeta { position: absolute; left: var(--mx); right: var(--mx); top: 50%; transform: translateY(-40%);
             background: #fff; border-radius: calc(var(--w) * 0.04); padding: calc(var(--w) * 0.05);
             box-shadow: 0 calc(var(--w) * 0.03) calc(var(--w) * 0.08) rgb(17 24 39 / 0.16);
             display: flex; align-items: center; gap: calc(var(--w) * 0.04); }
  .icono { flex: none; width: calc(var(--w) * 0.12); height: calc(var(--w) * 0.12); border-radius: 50%; background: var(--acento);
           display: grid; place-items: center; }
  .icono svg { width: 52%; height: 52%; }
  .meta { font-weight: 500; font-size: calc(var(--w) * 0.024); opacity: 0.5; margin-bottom: calc(var(--w) * 0.008); }
  .principal { font-weight: 600; font-size: calc(var(--w) * 0.045); line-height: 1.15; }
  .detalle { margin-top: calc(var(--w) * 0.01); font-weight: 500; font-size: calc(var(--w) * 0.03); opacity: 0.6; }
  .detalle:empty { display: none; }
  .logo { position: absolute; left: var(--mx); bottom: var(--my); height: calc(var(--w) * 0.045); }
  .sin-logo .logo { display: none; }
</style>
</head>
<body>
  <div class="lienzo {{clase_fondo}} {{clase_logo}} {{clase_etiqueta}}">
    <img class="fondo" src="{{fondo}}" alt="">
    <div class="velo"></div>
    <div class="cabecera">
      <span class="etiqueta">{{etiqueta}}</span>
      <h1>{{titulo}}</h1>
    </div>
    <div class="tarjeta">
      <div class="icono"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <div>
        <div class="meta">APES Admin · ahora</div>
        <div class="principal">{{tarjeta}}</div>
        <div class="detalle">{{detalle}}</div>
      </div>
    </div>
    <img class="logo" src="{{logo}}" alt="">
  </div>
</body>
</html>
