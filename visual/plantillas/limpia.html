<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  :root { --w: {{ancho}}px; --h: {{alto}}px; --primario: {{color_primario}}; --secundario: {{color_secundario}}; }
  * { margin: 0; box-sizing: border-box; }
  body { width: var(--w); height: var(--h); overflow: hidden; }
  .lienzo { position: relative; width: 100%; height: 100%; background: linear-gradient(135deg, var(--primario), var(--secundario)); }
  .fondo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .sin-fondo .fondo { display: none; }
  .logo { position: absolute; right: calc(var(--w) * 0.05); bottom: calc(var(--w) * 0.05); height: calc(var(--w) * 0.06);
          filter: drop-shadow(0 2px 6px rgb(0 0 0 / 0.35)); }
  .sin-logo .logo { display: none; }
</style>
</head>
<body>
  <div class="lienzo {{clase_fondo}} {{clase_logo}}">
    <img class="fondo" src="{{fondo}}" alt="">
    <img class="logo" src="{{logo}}" alt="">
  </div>
</body>
</html>
