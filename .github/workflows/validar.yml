name: validar

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # lo lanza generar.yml sobre la rama del lote

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Validar posts
        run: npm run validar
